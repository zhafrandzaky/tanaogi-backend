services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: tanaogi_app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    networks:
      - tanaogi_network
    depends_on:
      - mysql
      - mailpit
    environment:
      - APP_ENV=local

  nginx:
    image: nginx:alpine
    container_name: tanaogi_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - tanaogi_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: tanaogi_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: tanaogi
      MYSQL_USER: tanaogi_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tanaogi_network
    command: --default-authentication-plugin=mysql_native_password

  mailpit:
    image: axllent/mailpit:latest
    container_name: tanaogi_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tanaogi_network

networks:
  tanaogi_network:
    driver: bridge

volumes:
  mysql_data:
